backend:
  name: github
  repo: gmontellanos/anamadestudios
  branch: main
  base_url: https://anamadestudios-cms.montellanos01.workers.dev
  auth_endpoint: /auth
  auth_scope: repo

media_folder: images/uploads
public_folder: /images/uploads

collections:
  # ── BLOG POSTS ──────────────────────────
  - name: blog
    label: Blog Posts
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - label: Category
        name: category
        widget: select
        options:
          - Behind the Scenes
          - Clay Tips & Tricks
          - New Arrivals
          - Inspiration
          - Studio Life
      - { label: Cover Image, name: thumbnail, widget: image, required: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Body, name: body, widget: markdown }