---
layout: default
---

<article class="post-article">

  <header class="post-header">
    <img src="/images/flower-1.svg" class="deco deco-blog-flower1" alt="" aria-hidden="true"/>
    <img src="/images/bee.svg"      class="deco deco-blog-bee"     alt="" aria-hidden="true"/>
    <div class="post-header-inner">
      <a href="/blog/" class="post-back">← back to journal</a>
      {% if page.category %}
        <span class="blog-post-category">{{ page.category }}</span>
      {% endif %}
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
    </div>
    {% if page.thumbnail %}
      <div class="post-hero-img">
        <img src="{{ page.thumbnail }}" alt="{{ page.title }}" />
      </div>
    {% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="/blog/" class="btn btn-outline">← back to journal</a>
  </div>

</article>
